[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hdbg/safetynet"
readme = "README.md"


[workspace.dependencies]
safetynet-core = { path = "crates/safetynet-core", version = "0.1.3" }
safetynet-macros = { path = "crates/safetynet-macros", version = "0.1.3" }
safetynet-blackbox = { path = "crates/safetynet-blackbox", version = "0.1.3" }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"   # ignored for the test profile; cargo warns, that is expected
strip = "symbols"
