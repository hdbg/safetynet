[package]
name = "safetynet-macros"
description = "Proc-macros for safetynet: #[safetynet], #[derive(VmLayout)], asm!."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
# Compiler plugin: this crate and its dependencies are never linked into the
# target binary, which is what keeps the assembler out of the shipped artifact.
proc-macro = true

[features]
# The IR listing behind `SN_DUMP_IR` and the reason in an assembler error.
# Never enabled from a dependency edge: a proc-macro built as a workspace
# member has its dependencies unified with the runtime's, and the feature
# would reach the shipped binary.
debug = ["safetynet-core/debug"]

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
safetynet-core.workspace = true
syn.workspace = true

[dev-dependencies]
# Outside a compiler a span carries a position only if proc-macro2 was asked to
# track one, and the error tests assert where an error points.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# The lowerer tests pin the IR listing.
safetynet-core = { workspace = true, features = ["debug"] }

[lints]
workspace = true
