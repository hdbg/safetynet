name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Both byte orders are covered by this single run: the order is a source
      # literal, not a build flag, so order coverage comes from tests that are
      # generic over `B` and instantiated for `Le` and `Be`. There is
      # deliberately no feature matrix here to keep in sync.
      - name: test
        run: cargo test --workspace --all-targets

      - name: doc tests
        run: cargo test --workspace --doc

      - name: release build
        run: cargo build --release --workspace
