name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: --locked

      - name: format
        run: mise exec -- cargo fmt --all --check

      - name: clippy
        run: mise exec -- cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: mise exec -- cargo nextest run --all --no-fail-fast

      - name: release build
        run: mise exec -- cargo build --release --workspace
